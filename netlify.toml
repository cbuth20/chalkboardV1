[build]
  command = "npm run build"
  publish = ".next"

[dev]
  command = "npm run dev"
  targetPort = 3000
  port = 8888
  framework = "next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Redirect API routes to Netlify Functions
[[redirects]]
  from = "/api/onboarding/status"
  to = "/.netlify/functions/onboarding-status"
  status = 200

